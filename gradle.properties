org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g
# iOS targets cannot be built on Linux/Windows; skip them quietly there.
kotlin.native.ignoreDisabledTargets=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Production API base URL (HTTPS). Override in ~/.gradle/gradle.properties or with -P.
financemanage.apiBaseUrl.release=https://api.financemanage.example

# Google sign-in (Android): the OAuth *web* client id whose audience the backend accepts (GOOGLE_CLIENT_IDS).
# Leave empty to hide the Google button.
financemanage.googleWebClientId=
