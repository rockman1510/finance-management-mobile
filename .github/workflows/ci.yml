name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :composeApp:assembleDebug --continue 2>&1 | tee build.log
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --continue 2>&1 | tee test.log
      - name: Summarize errors
        if: failure()
        run: |
          echo "==================== ERRORS ===================="
          cat build.log test.log 2>/dev/null | grep -E "^e: |What went wrong|^> |FAILED|Could not|error:" | grep -v "^> Task" | head -150 || true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: '**/build/reports/tests/'

  lint:
    name: ktlint + detekt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ktlintCheck detekt --continue

  ios:
    name: iOS build + tests
    runs-on: macos-latest
    # A cold Kotlin/Native build (no Gradle cache, e.g. after changes to the core modules) compiles and links a test
    # binary for every module and needs more than an hour; a warm one takes about 35 minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared tests on the iOS simulator
        run: |
          set -o pipefail
          ./gradlew iosSimulatorArm64Test --continue 2>&1 | tee ios.log
      - name: Build the iOS app
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcode.log
      - name: Summarize errors
        if: failure()
        run: |
          echo "==================== ERRORS ===================="
          cat ios.log xcode.log 2>/dev/null | grep -E "^e: |What went wrong|^> |FAILED|Could not|error:" | grep -v "^> Task" | head -150 || true
